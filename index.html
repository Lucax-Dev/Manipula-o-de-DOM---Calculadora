<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula de DOM</title>
    <style>
        .destaque {
            background-color: yellow;
            color: black;
            padding: 20px;
        }
        img {
            display: block;
            margin-top: 15px;
            width: 200px;
        }
    </style>
</head>
<body>

    <h1 id="titulo">Aula de DOM</h1>
    <p id="descricao">Aprendendo a manipular com JavaScript</p>

    <p class="mensagem">Primeira mensagem</p>
    <p class="mensagem">Segunda mensagem</p>

    <button id="botao" onclick="mostrarMensagem()">Alterar Página</button>

    <button onclick="alternarDestaque()">Destacar Título</button>

    <input id="nome" type="text" placeholder="Digite seu nome">

    <button onclick="mostrarNome()">Mostrar Nome</button>

    <p id="resultado"></p>

    <button onclick="trocarImagem()">Trocar imagem</button>
    
    <img id="imagem" src="https://i.pinimg.com/474x/71/4b/48/714b4865f7828b0e918686665f38e44e.jpg" alt="Vai Corinthians">

    <a id="link" href="https://google.com">Abrir site</a>

    <button onclick="adicionarParagrafo()">Adicionar Parágrafo</button>
   
    <div id="conteudo"></div>

    <ul id="lista"></ul>

    <p id="aviso">Este aviso pode ser removido.</p>
    <button onclick="removerAviso()">Remover aviso</button>

    <script src="script.js"></script>
    
</body>
</html>
